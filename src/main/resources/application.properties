# Server Configuration (IMPORTANT for deployment)
server.port=${PORT:9000}

# Application
spring.application.name=stock-analyzer

# Jackson (JSON handling)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.stockanalyzer=INFO
logging.level.org.springframework.web=WARN

# WebSocket (optional - keep if you are using it)
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536

# Actuator (optional but useful for health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
